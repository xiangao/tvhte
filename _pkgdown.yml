url: https://xiangao.github.io/tvhte/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Main estimator
    desc: >
      Two-step QMLE + Tweedie/Gaussian empirical-Bayes estimator
      (Botosaru-Liu 2025). Click through for runnable examples.
    contents:
      - tvhte
  - title: Covariate feedback (Botosaru-Liu 2026)
    desc: >
      Homogeneous-feedback factorisation and counterfactual
      decomposition into direct vs indirect components.
    contents:
      - fit_feedback
      - simulate_counterfactual
  - title: Simulation
    desc: >
      Data generator covering vanilla, staggered (with never-treated),
      and feedback DGPs. Click through for example calls.
    contents:
      - simulate_tvhte

articles:
  - title: Vignettes
    contents:
      - illustrative

home:
  links:
    - text: Botosaru-Liu (2025) arXiv
